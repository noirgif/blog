# Theme "nir" — a lightweight reimagining of the Tranquilpeak look used on nir.moe.
# Everything here is optional; posts and drafts are managed with the usual `hexo new` commands.

menu:
  - { key: home,       url: /,               icon: home }
  - { key: categories, url: /all-categories/, icon: bookmark }
  - { key: tags,       url: /all-tags/,       icon: tag }
  - { key: archives,   url: /all-archives/,   icon: archive }
  - { key: search,     url: /search/,         icon: search, action: search }
  - { key: about,      url: /about/,          icon: help }
  - { key: links,      url: /links/,          icon: link }

author_links:
  - { key: github, url: https://github.com/noirgif, icon: github }
  - { key: rss,    url: /feeds/,                    icon: rss }

# Images in the theme's `source/img` folder (optimized automatically at build time)
avatar: /img/avatar.jpg
cover: /img/cover.jpg

# Comments: https://giscus.app
giscus:
  repo: noirgif/blog
  repo_id: MDEwOlJlcG9zaXRvcnkxODQzNDg5NjM=
  category: Announcements
  category_id: DIC_kwDOCvzxI84DG8w1
  mapping: pathname

# Cloudflare Web Analytics, loaded on the visitor's first interaction (pages leave out the
# optional </body> tag where Cloudflare would otherwise inject the beacon at load).
cloudflare_analytics_token: 698f0e73d46444e2a2b2220b0a6de77b

# Responsive image widths generated for local photos. 736 is the text column on desktop,
# 656 the column on a typical 412px-wide phone at 1.75x; the rest cover other screens.
image_widths: [96, 160, 192, 240, 320, 480, 656, 736, 960, 1200, 1472, 2000]
image_quality: 65
